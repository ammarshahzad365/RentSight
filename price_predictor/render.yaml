# render.yaml — Render Blueprint for RentSight Price Predictor
# https://docs.render.com/blueprint-spec
#
# Deploy with: "New +" → "Blueprint" → point to this repo (root dir must
# contain this file, OR set rootDir in the service definition below).

services:
  - type: web
    name: rentsight-price-predictor
    runtime: docker
    region: oregon
    plan: free
    rootDir: price_predictor
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHON_VERSION
        value: "3.12.0"
    healthCheckPath: /
    autoDeploy: true
